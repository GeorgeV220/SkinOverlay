Options:
  experimental features: false #Turn on experimental features
  debug: false
  proxy: false
  secret: "SECRET HERE"
  mineskin api key: "none"
  # Supported locales: en, fr, de, it, es, pt, nl, no, sv, da, fi, pl, cs, sk, hu, ro, bg, el, ru, tr, zh, ja, ko, en_US, en_GR, es_ES, es_MX, pt_BR, fr_CA
  # You must have a file with the locale you want for example messages_en_US.yml or messages_el.yml
  locale: "en_US"
  commands: #Disable or enable plugin commands
    skinoverlay: true
  updater:
    enabled: true
  default skin uuid: "8667ba71-b85a-4004-af54-457a9734eed7"
  #Skin hooks are only used to retrieve player skin properties for offline players or players who have changed their skin.
  #Currently available Skin Hooks: None, SkinsRestorer and Custom.
  #With the custom option, you need to have your own plugin that sets the SkinOverlay.getInstance().setSkinHook(SkinHook).
  skin hook: None

  # WARNING: Only use this feature if you fully understand the implications.
  # The value represents the time (in SECONDS) between automatic saves of player and skin data.
  # The primary benefit of batching saves is to reduce performance overhead by saving changes less frequently,
  # rather than saving each change individually.
  #
  # However, please note: If the server crashes before changes are saved, you may lose unsaved data.
  #
  # The reason for introducing this feature is that, in previous versions, concurrent saves to the disk could occur
  # if one save operation was in progress while another change was made.
  # This could lead to file corruption, as two threads would be attempting to write to the same file simultaneously.
  #
  # Recommended Usage:
  # - Set a reasonable save interval to balance between performance and data safety.
  # - If you're running a highly active server with frequent changes, consider a lower save interval to reduce data loss risk.
  save interval: 20  # Time in SECONDS between saves. Adjust based on server load and performance needs.

  # The following option is used to specify which protocol the proxy/backend server will use to send/listen the skin data.
  # Available options: "PluginMessage" and "Redis"
  # If you are using a backend server that doesn't support the Bungee/Velocity PluginMessage protocol, please set it to "Redis".
  connection type: "PluginMessage"

  # Redis connection details
  redis:
    host: "localhost"
    port: 6379
    password: ""