name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # We want to run on external PRs, but not on our own internal PRs as they'll be run
    # by the push to the branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository


    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_URL: "https://api.github.com/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          path: |
            bukkit/build/libs/*.jar
            fabric/build/libs/*.jar
            velocity/build/libs/*.jar
            common/build/libs/*.jar
            build-info/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: [ build ]
    if: >-
      github.event_name != 'pull_request' &&
      contains(fromJSON('["refs/heads/master", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)

    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Set up Node.js v22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Grant execute permission for update-versions.sh
        run: chmod +x update-versions.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_URL: "https://api.github.com/"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: npx --legacy-peer-deps -p @semantic-release/changelog -p @semantic-release/git -p @semantic-release/exec -p gradle-semantic-release-plugin -p semantic-release semantic-release
